<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/__spa_ui/static/webloom-app.css"><title>API keys · WebLoom</title></head><body><div class="shell"><aside class="sidebar"><a class="brand" href="/"><span class="brand-mark"></span><span>WebLoom</span></a><div class="nav-label">Developer</div><nav class="side-nav"><a class="active" href="/api-keys"><svg viewBox="0 0 24 24"><path d="M14 7a5 5 0 1 0-3 4.6L14 15h3v3h3v-5l-4-4"/></svg>API keys</a><a href="/docs/api"><svg viewBox="0 0 24 24"><path d="M5 4h14v16H5zM8 8h8M8 12h8M8 16h5"/></svg>API docs</a><a href="/docs/mcp"><svg viewBox="0 0 24 24"><path d="M7 7h10v10H7zM3 12h4m10 0h4M12 3v4m0 10v4"/></svg>MCP</a></nav><div class="nav-label">Workspace</div><nav class="side-nav"><a href="/dashboard">Overview</a><a href="/new">New capture</a><a href="/project">Projects</a></nav></aside><main class="main"><header class="topbar"><div class="topbar-left"><button class="btn mobile-menu" data-menu aria-label="Open navigation">☰</button><span class="page-title">API keys</span></div><div class="top-actions"><a class="btn" href="/docs/api">Read docs</a><a class="avatar" href="/account">WL</a></div></header><div class="content"><div class="hero-row reveal"><div><h1>Developer API keys</h1><p>Create keys for the WebLoom API and MCP server. Raw keys are shown once.</p></div></div><section class="card reveal"><div class="field"><label for="keyName">Key name</label><input id="keyName" maxlength="80" placeholder="My laptop"></div><div class="form-actions" style="margin-top:12px"><button class="btn primary" id="createApiKey" type="button">Create API key</button></div><div class="form-status" id="apiKeyStatus"></div><div id="newKeyBox" class="code-panel" style="display:none;margin-top:14px"></div></section><div class="section-head"><div><h2>Your keys</h2><p>Revoke anything you no longer use.</p></div></div><section class="card reveal"><div id="apiKeyList"><div class="capture-running" style="min-height:160px"><div class="capture-spinner"></div><p>Loading API keys…</p></div></div></section></div></main></div><script src="/__spa_ui/static/webloom-app.js"></script><script>
const statusEl=document.getElementById("apiKeyStatus"),listEl=document.getElementById("apiKeyList"),box=document.getElementById("newKeyBox");
async function call(url,options={}){const r=await fetch(url,{credentials:"same-origin",...options});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"Request failed.");return d;}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
async function load(){try{const d=await call("/api/api-keys");const rows=d.keys||[];listEl.innerHTML=rows.length?'<div class="data-list">'+rows.map(k=>'<div class="data-row"><div><b>'+esc(k.name)+'</b><div class="metric-sub">'+esc(k.key_prefix)+'•••••••• · created '+esc((k.created_at||"").slice(0,10))+(k.last_used_at?' · used '+esc((k.last_used_at||"").slice(0,10)):'')+'</div></div>'+(k.revoked_at?'<span>revoked</span>':'<button class="btn" data-revoke="'+esc(k.id)+'">Revoke</button>')+'</div>').join("")+'</div>':'<div class="project-empty-copy"><h3>No API keys yet.</h3><p>Create one above for API or MCP access.</p></div>';document.querySelectorAll("[data-revoke]").forEach(b=>b.addEventListener("click",async()=>{b.disabled=true;try{await call("/api/api-keys/"+b.dataset.revoke,{method:"DELETE"});await load();}catch(e){statusEl.textContent=e.message;statusEl.className="form-status error";b.disabled=false;}}));}catch(e){listEl.innerHTML='<div class="project-tab-error">'+esc(e.message)+'</div>';}}
document.getElementById("createApiKey").addEventListener("click",async()=>{const b=document.getElementById("createApiKey");b.disabled=true;statusEl.textContent="";try{const d=await call("/api/api-keys",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:document.getElementById("keyName").value.trim()||"Default key"})});box.style.display="block";box.textContent=d.key;statusEl.textContent="Copy this key now — it will not be shown again.";statusEl.className="form-status ok";await load();}catch(e){statusEl.textContent=e.message;statusEl.className="form-status error";}finally{b.disabled=false;}});
load();
</script></body></html>
