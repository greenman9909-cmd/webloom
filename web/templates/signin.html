<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><meta name="robots" content="noindex,nofollow"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/__spa_ui/static/webloom-app.css"><title>Sign in · WebLoom</title></head><body><div class="auth-page"><div class="auth-brand"><a class="brand" href="/"><span class="brand-mark"></span><span>WebLoom</span></a></div><section class="auth-visual"><div class="auth-quote"><span class="badge" style="background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.16)">WebLoom workspace</span><h2>From live website to organized project — in one pass.</h2><p>Capture the public structure, inspect the result, and keep every project in one clean workspace.</p></div></section><section class="auth-form-wrap"><form class="auth-form" id="signinForm"><h1>Welcome back.</h1><p>Sign in to continue to your projects.</p><div class="field"><label>Email</label><input id="signinEmail" type="email" autocomplete="email" placeholder="you@example.com" required></div><div class="field"><label>Password</label><input id="signinPassword" type="password" autocomplete="current-password" placeholder="••••••••" required></div><button class="btn primary full" type="submit">Sign in →</button><p class="auth-error" id="signinError" role="alert"></p><div class="auth-switch">New to WebLoom? <a href="/signup">Create an account</a></div></form></section></div><script src="/__spa_ui/static/webloom-app.js"></script><script>
const f=document.getElementById("signinForm"),err=document.getElementById("signinError");
f.addEventListener("submit",async e=>{e.preventDefault();err.textContent="";const b=f.querySelector("button");b.disabled=true;b.textContent="Signing in…";try{const r=await fetch("/api/auth/signin",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:document.getElementById("signinEmail").value,password:document.getElementById("signinPassword").value})});const d=await r.json();if(!r.ok)throw new Error(d.error||"Sign in failed.");location.href=d.redirect||"/dashboard"}catch(x){err.textContent=x.message;b.disabled=false;b.textContent="Sign in →"}})
</script></body></html>
