name: WebLoom CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Compile Python
        run: python -m py_compile web_app.py webloom_integrations.py spa_ripper/*.py
      - name: Run tests
        env:
          PYTHONPATH: .
        run: pytest -q
